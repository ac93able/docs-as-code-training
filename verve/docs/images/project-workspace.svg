<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Project workspace</title>
  <desc id="desc">A project workspace showing settings, members, activity, and project status.</desc>
  <rect width="1200" height="700" fill="#eef5f3"/>
  <rect x="75" y="70" width="1050" height="560" rx="22" fill="#ffffff" stroke="#c9ded8" stroke-width="3"/>
  <rect x="75" y="70" width="1050" height="90" rx="22" fill="#244c53"/>
  <text x="125" y="125" font-size="32" fill="#ffffff" font-family="Arial, sans-serif" font-weight="700">Customer onboarding - Q3</text>
  <rect x="850" y="98" width="210" height="42" rx="8" fill="#e4f2ed"/>
  <text x="895" y="126" font-size="18" fill="#245d51" font-family="Arial, sans-serif">Project settings</text>
  <rect x="120" y="205" width="300" height="350" rx="16" fill="#f3f8f7"/>
  <text x="155" y="255" font-size="24" fill="#244c53" font-family="Arial, sans-serif" font-weight="700">Members</text>
  <circle cx="180" cy="310" r="22" fill="#e4b96c"/>
  <text x="220" y="318" font-size="20" fill="#42545a" font-family="Arial, sans-serif">Project owner</text>
  <circle cx="180" cy="375" r="22" fill="#86b9ad"/>
  <text x="220" y="383" font-size="20" fill="#42545a" font-family="Arial, sans-serif">Team member</text>
  <circle cx="180" cy="440" r="22" fill="#9eb7d2"/>
  <text x="220" y="448" font-size="20" fill="#42545a" font-family="Arial, sans-serif">Reviewer</text>
  <rect x="155" y="490" width="170" height="42" rx="8" fill="#244c53"/>
  <text x="190" y="518" font-size="18" fill="#ffffff" font-family="Arial, sans-serif">Add member</text>
  <rect x="465" y="205" width="610" height="155" rx="16" fill="#fff5df"/>
  <text x="505" y="255" font-size="24" fill="#785417" font-family="Arial, sans-serif" font-weight="700">Project activity</text>
  <text x="505" y="300" font-size="20" fill="#866c3b" font-family="Arial, sans-serif">Status update added by the project owner</text>
  <text x="505" y="333" font-size="18" fill="#a0834b" font-family="Arial, sans-serif">Next review: Friday</text>
  <rect x="465" y="395" width="290" height="160" rx="16" fill="#e8f3f0"/>
  <text x="505" y="445" font-size="23" fill="#245d51" font-family="Arial, sans-serif" font-weight="700">Work items</text>
  <text x="505" y="487" font-size="19" fill="#44776d" font-family="Arial, sans-serif">12 complete</text>
  <text x="505" y="520" font-size="19" fill="#44776d" font-family="Arial, sans-serif">4 in progress</text>
  <rect x="785" y="395" width="290" height="160" rx="16" fill="#edf1f8"/>
  <text x="825" y="445" font-size="23" fill="#334d6b" font-family="Arial, sans-serif" font-weight="700">Visibility</text>
  <text x="825" y="487" font-size="19" fill="#536f8e" font-family="Arial, sans-serif">Team</text>
  <text x="825" y="520" font-size="19" fill="#536f8e" font-family="Arial, sans-serif">Shared with members</text>
</svg>

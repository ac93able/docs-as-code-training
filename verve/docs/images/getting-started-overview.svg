<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Getting Started overview</title>
  <desc id="desc">A flow showing a user preparing access, installing Verve, signing in, creating a project, and opening the workspace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#f5f8ff"/>
      <stop offset="100%" stop-color="#eefaf4"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#3b82f6"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #1d3557; }
      .step { font: 700 24px Arial, sans-serif; fill: #1d3557; }
      .small { font: 600 18px Arial, sans-serif; fill: #4b5563; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect x="80" y="90" width="1040" height="520" rx="28" fill="#ffffff" stroke="#dfe8ff" stroke-width="2"/>

  <text x="600" y="150" text-anchor="middle" class="title">Getting started in Verve</text>

  <g>
    <rect x="100" y="260" width="170" height="120" rx="20" fill="#edf4ff"/>
    <circle cx="150" cy="320" r="26" fill="#7ea7ff"/>
    <path d="M139 320c0-11 9-20 20-20s20 9 20 20-9 20-20 20-20-9-20-20zm-18 39c6-17 24-29 38-29s32 12 38 29" fill="#ffffff"/>
    <text x="185" y="306" text-anchor="middle" class="step">Access</text>
    <text x="185" y="334" text-anchor="middle" class="small">Account</text>
  </g>

  <g>
    <rect x="310" y="260" width="170" height="120" rx="20" fill="#eafaf1"/>
    <path d="M365 285v46l30 18 30-18v-46l-30 18-30-18zm30 44l-20-12v28l20 12 20-12v-28l-20 12z" fill="#22a06b"/>
    <text x="395" y="340" text-anchor="middle" class="step">Install</text>
  </g>

  <g>
    <rect x="520" y="260" width="170" height="120" rx="20" fill="#edf4ff"/>
    <rect x="548" y="289" width="114" height="66" rx="14" fill="#dfeeff"/>
    <circle cx="572" cy="322" r="8" fill="#3b82f6"/>
    <rect x="585" y="314" width="52" height="10" rx="5" fill="#7ea7ff"/>
    <rect x="585" y="330" width="42" height="10" rx="5" fill="#7ea7ff"/>
    <text x="605" y="365" text-anchor="middle" class="step">Sign in</text>
  </g>

  <g>
    <rect x="730" y="260" width="170" height="120" rx="20" fill="#fff4d8"/>
    <rect x="760" y="290" width="110" height="32" rx="8" fill="#f5d98d"/>
    <rect x="760" y="332" width="84" height="18" rx="8" fill="#f7e8b6"/>
    <text x="815" y="365" text-anchor="middle" class="step">Project</text>
  </g>

  <g>
    <rect x="940" y="260" width="170" height="120" rx="20" fill="#eafaf1"/>
    <rect x="974" y="292" width="102" height="64" rx="12" fill="#dff5ec"/>
    <rect x="998" y="306" width="28" height="36" rx="6" fill="#22a06b"/>
    <rect x="1035" y="306" width="22" height="8" rx="4" fill="#8ad5b0"/>
    <rect x="1035" y="320" width="18" height="8" rx="4" fill="#8ad5b0"/>
    <text x="1025" y="365" text-anchor="middle" class="step">Open</text>
  </g>

  <path d="M270 320h40" stroke="#3b82f6" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M480 320h40" stroke="#3b82f6" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M690 320h40" stroke="#3b82f6" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M900 320h40" stroke="#3b82f6" stroke-width="6" fill="none" marker-end="url(#arrow)"/>

  <rect x="260" y="440" width="680" height="90" rx="22" fill="#edf3ff"/>
  <text x="600" y="494" text-anchor="middle" class="step">Prepare, install, sign in, and create your first project</text>
</svg>


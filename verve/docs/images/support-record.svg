<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Support record</title>
  <desc id="desc">A support record showing the problem, expected result, message, environment, and affected account.</desc>
  <rect width="1200" height="700" fill="#eef2f5"/>
  <rect x="150" y="70" width="900" height="560" rx="20" fill="#ffffff" stroke="#cbd5dc" stroke-width="3"/>
  <rect x="150" y="70" width="900" height="90" rx="20" fill="#425b70"/>
  <text x="205" y="126" font-size="32" fill="#ffffff" font-family="Arial, sans-serif" font-weight="700">Verve support record</text>
  <text x="205" y="220" font-size="21" fill="#50616e" font-family="Arial, sans-serif" font-weight="700">Problem</text>
  <rect x="205" y="240" width="390" height="55" rx="8" fill="#f3f6f8" stroke="#cbd5dc"/>
  <text x="225" y="275" font-size="18" fill="#9aa6ae" font-family="Arial, sans-serif">Describe what failed</text>
  <text x="625" y="220" font-size="21" fill="#50616e" font-family="Arial, sans-serif" font-weight="700">Expected result</text>
  <rect x="625" y="240" width="370" height="55" rx="8" fill="#f3f6f8" stroke="#cbd5dc"/>
  <text x="645" y="275" font-size="18" fill="#9aa6ae" font-family="Arial, sans-serif">Describe what should happen</text>
  <text x="205" y="350" font-size="21" fill="#50616e" font-family="Arial, sans-serif" font-weight="700">Message displayed</text>
  <rect x="205" y="370" width="790" height="55" rx="8" fill="#fff4df" stroke="#e3c17b"/>
  <text x="225" y="405" font-size="18" fill="#9a7a3c" font-family="Arial, sans-serif">Copy the exact message</text>
  <text x="205" y="480" font-size="21" fill="#50616e" font-family="Arial, sans-serif" font-weight="700">Environment</text>
  <text x="205" y="520" font-size="18" fill="#657783" font-family="Arial, sans-serif">Verve version  |  Operating system  |  Time of failure</text>
  <text x="205" y="575" font-size="21" fill="#50616e" font-family="Arial, sans-serif" font-weight="700">Affected account or project</text>
  <text x="545" y="575" font-size="18" fill="#657783" font-family="Arial, sans-serif">Include scope, never passwords or codes</text>
</svg>

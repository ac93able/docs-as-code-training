<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Verve sign-in flow</title>
  <desc id="desc">A sign-in form connected to account verification and the project dashboard.</desc>
  <rect width="1200" height="700" fill="#f7f4ef"/>
  <text x="90" y="100" font-size="42" fill="#243447" font-family="Arial, sans-serif" font-weight="700">Sign in to Verve</text>
  <rect x="90" y="150" width="430" height="410" rx="20" fill="#ffffff" stroke="#d9d2c5" stroke-width="3"/>
  <text x="140" y="220" font-size="28" fill="#243447" font-family="Arial, sans-serif" font-weight="700">Account access</text>
  <text x="140" y="275" font-size="20" fill="#5c6875" font-family="Arial, sans-serif">Username</text>
  <rect x="140" y="295" width="330" height="48" rx="8" fill="#f1f5f8" stroke="#c8d1d9"/>
  <text x="160" y="326" font-size="18" fill="#8793a0" font-family="Arial, sans-serif">your username</text>
  <text x="140" y="385" font-size="20" fill="#5c6875" font-family="Arial, sans-serif">Password</text>
  <rect x="140" y="405" width="330" height="48" rx="8" fill="#f1f5f8" stroke="#c8d1d9"/>
  <circle cx="165" cy="429" r="5" fill="#5c6875"/>
  <circle cx="185" cy="429" r="5" fill="#5c6875"/>
  <circle cx="205" cy="429" r="5" fill="#5c6875"/>
  <rect x="140" y="485" width="150" height="48" rx="8" fill="#2f6f8f"/>
  <text x="178" y="516" font-size="19" fill="#ffffff" font-family="Arial, sans-serif" font-weight="700">Sign in</text>
  <path d="M570 355h95" stroke="#2f6f8f" stroke-width="8" stroke-linecap="round"/>
  <path d="m645 325 35 30-35 30" fill="none" stroke="#2f6f8f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="720" y="205" width="370" height="120" rx="18" fill="#e8f3f0" stroke="#a5cfc2" stroke-width="3"/>
  <text x="770" y="255" font-size="25" fill="#235c50" font-family="Arial, sans-serif" font-weight="700">Active account</text>
  <text x="770" y="290" font-size="19" fill="#44776d" font-family="Arial, sans-serif">Credentials accepted</text>
  <path d="M905 345v75" stroke="#2f6f8f" stroke-width="8" stroke-linecap="round"/>
  <path d="m875 395 30 35 30-35" fill="none" stroke="#2f6f8f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="720" y="455" width="370" height="120" rx="18" fill="#fff0d4" stroke="#e3c17b" stroke-width="3"/>
  <text x="770" y="505" font-size="25" fill="#785417" font-family="Arial, sans-serif" font-weight="700">Project dashboard</text>
  <text x="770" y="540" font-size="19" fill="#8b6b32" font-family="Arial, sans-serif">Create and manage projects</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Installation flow</title>
  <desc id="desc">A workflow illustration showing how to download and install the application.</desc>
  <rect width="1200" height="700" fill="#f7faff"/>
  <rect x="80" y="90" width="1040" height="520" rx="28" fill="#ffffff" stroke="#dfe9ff" stroke-width="2"/>
  <g>
    <rect x="150" y="220" width="170" height="110" rx="22" fill="#ebf1ff"/>
    <text x="185" y="275" font-size="28" fill="#1d3557" font-family="Arial, sans-serif" font-weight="700">1.</text>
    <text x="220" y="275" font-size="28" fill="#1d3557" font-family="Arial, sans-serif" font-weight="700">Download</text>
  </g>
  <path d="M320 275h118" stroke="#6aa1ff" stroke-width="8" stroke-linecap="round"/>
  <path d="M400 275l-28 28m28-28l-28-28" stroke="#6aa1ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <g>
    <rect x="430" y="220" width="170" height="110" rx="22" fill="#eafaf1"/>
    <text x="465" y="275" font-size="28" fill="#1d3557" font-family="Arial, sans-serif" font-weight="700">2.</text>
    <text x="500" y="275" font-size="28" fill="#1d3557" font-family="Arial, sans-serif" font-weight="700">Install</text>
  </g>
  <path d="M600 275h118" stroke="#45b883" stroke-width="8" stroke-linecap="round"/>
  <path d="M680 275l-28 28m28-28l-28-28" stroke="#45b883" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <g>
    <rect x="710" y="220" width="170" height="110" rx="22" fill="#fff3d9"/>
    <text x="745" y="275" font-size="28" fill="#1d3557" font-family="Arial, sans-serif" font-weight="700">3.</text>
    <text x="780" y="275" font-size="28" fill="#1d3557" font-family="Arial, sans-serif" font-weight="700">Verify</text>
  </g>
  <rect x="250" y="430" width="700" height="110" rx="24" fill="#edf3ff"/>
  <text x="330" y="495" font-size="30" fill="#1d3557" font-family="Arial, sans-serif" font-weight="700">Sign in and confirm the application starts</text>
</svg>
